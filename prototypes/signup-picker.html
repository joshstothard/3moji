<!--
  3moji — home page + sign-up picker PROTOTYPE. THROWAWAY CODE, issue #13.

  Core idea being prototyped: the home page and an UNCLAIMED Handle page are the
  SAME component in two states.
    - `3moji.me/`          -> the builder with three empty slots
    - `3moji.me/<3 emoji>` -> the same builder, slots pre-filled from the path
  Both show the live URL preview, the availability verdict, and one big claim
  button. Use the "Arrive as a visitor at" strip at the top to flip between them.

  Plan (prototype skill, UI branch):
    Three variants of the landing moment + picker LAYOUT, via `#variant=A|B|C`
    and the floating bottom bar.
      A — Search-first: one column, URL preview and slots pinned above a flat grid.
      B — Group-tabbed: eight group tabs drive the grid, slots in a right rail.
      C — Slot-driven: the three slots are the page; tap a slot, browse a sheet.
    Built ONCE and shared (flow steps, not design options): the live URL preview,
    the availability verdict, the spoken form, the email+password hand-off, the
    "held for 24 hours" screen, and the claimed-but-unedited Profile.

  No build step, no network. Open this file directly in a browser.
  Availability is faked from the hardcoded TAKEN / HELD sets below.
-->

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3moji — home page and sign-up picker prototype</title>

<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #475569;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --accent: #4f46e5;
    --accent-ink: #3730a3;
    --ok: #047857;
    --ok-bg: #ecfdf5;
    --bad: #b91c1c;
    --bad-bg: #fef2f2;
    --warn: #a16207;
    --warn-bg: #fffbeb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 92px;
  }
  h1, h2, h3 { line-height: 1.15; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .proto-flag {
    background: #1e293b; color: #e2e8f0; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 14px; text-align: center;
  }
  .arrival {
    background: #0f172a; color: #cbd5e1; padding: 9px 14px;
    display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap;
    font-size: 13px; border-bottom: 1px solid #334155;
  }
  .arrival button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 999px; padding: 5px 12px; font-size: 13px;
  }
  .arrival button:hover { background: #334155; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 18px 0; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: 0 1px 2px rgb(15 23 42 / .05);
  }

  /* ---------- landing ---------- */
  .hero { text-align: center; padding: 28px 16px 20px; }
  .hero.left { text-align: left; }
  .hero h1 { font-size: clamp(26px, 4.6vw, 42px); letter-spacing: -.02em; }
  .hero .glyphs { font-size: clamp(36px, 7.5vw, 58px); letter-spacing: .08em; }
  .hero p { color: var(--muted); max-width: 46ch; margin: 12px auto 0; font-size: 17px; }
  .hero.left p { margin-left: 0; }
  .hero .say {
    display: inline-block; margin-top: 14px; padding: 7px 14px;
    background: #eef2ff; color: var(--accent-ink);
    border-radius: 999px; font-size: 15px;
  }
  .rule { margin-top: 12px; font-size: 14px; color: var(--muted); }

  .arrived-banner {
    background: #eef2ff; border: 1px solid #c7d2fe; color: var(--accent-ink);
    border-radius: var(--radius); padding: 13px 16px; margin-bottom: 14px;
    font-size: 15px; text-align: center;
  }

  /* ---------- live URL preview ---------- */
  .urlbar {
    display: flex; align-items: center; justify-content: center; gap: 2px;
    flex-wrap: wrap; padding: 14px 12px; border-radius: var(--radius);
    background: #fff; border: 2px solid var(--accent);
    font-size: clamp(22px, 4.6vw, 36px); font-weight: 600; letter-spacing: -.01em;
  }
  .urlbar .host { color: var(--faint); font-weight: 500; }
  .urlbar .picked { letter-spacing: .06em; }
  .urlbar .blank {
    display: inline-block; width: .78em; height: .1em; background: #cbd5e1;
    border-radius: 2px; margin: 0 .06em .12em;
  }

  /* ---------- slots ---------- */
  .slots-panel { padding: 16px; }
  .slots-row { display: flex; gap: 10px; justify-content: center; align-items: flex-start; }
  .slot { flex: 0 0 auto; width: 92px; text-align: center; }
  .slot-btn {
    width: 92px; height: 92px; border-radius: var(--radius);
    border: 2px dashed var(--line); background: #fff;
    font-size: 44px; line-height: 1; display: flex;
    align-items: center; justify-content: center;
  }
  .slot-btn.filled { border-style: solid; border-color: var(--accent); background: #f5f3ff; }
  .slot-btn.active { border-color: var(--accent); box-shadow: 0 0 0 3px #c7d2fe; }
  .slot-name {
    font-size: 12px; color: var(--muted); margin-top: 6px;
    min-height: 30px; word-break: break-word;
  }
  .slot-tools { display: flex; gap: 3px; justify-content: center; margin-top: 4px; }
  .slot-tools button {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    width: 26px; height: 26px; font-size: 13px; line-height: 1; padding: 0; color: var(--muted);
  }
  .slot-tools button:disabled { opacity: .3; cursor: not-allowed; }
  .slot-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 9px 15px; font-size: 14px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:disabled { background: var(--faint); border-color: var(--faint); cursor: not-allowed; }
  .btn-big { font-size: 17px; padding: 14px 26px; }

  /* ---------- spoken form ---------- */
  .spoken { text-align: center; margin-top: 14px; }
  .spoken-names { font-size: clamp(18px, 3.2vw, 26px); font-weight: 600; letter-spacing: -.01em; }
  .spoken-sentence { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .spoken-sentence q { font-style: italic; color: var(--ink); }

  /* ---------- verdict ---------- */
  .verdict { margin-top: 14px; padding: 15px 16px; border-radius: var(--radius); border: 1px solid var(--line); }
  .verdict h3 { font-size: 17px; }
  .verdict p { margin: 6px 0 0; font-size: 14.5px; }
  .verdict.available { background: var(--ok-bg); border-color: #a7f3d0; color: var(--ok); }
  .verdict.taken { background: var(--bad-bg); border-color: #fecaca; color: var(--bad); }
  .verdict.held { background: var(--warn-bg); border-color: #fde68a; color: var(--warn); }
  .verdict.reserved { background: #f1f5f9; }
  .verdict .status-word { text-transform: uppercase; letter-spacing: .07em; font-size: 12px; font-weight: 700; }
  .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .suggestion {
    background: #fff; border: 1px solid currentColor; border-radius: 999px;
    padding: 7px 13px; font-size: 20px; display: inline-flex; align-items: center; gap: 8px;
  }
  .suggestion .sg-why { font-size: 12.5px; }

  /* ---------- search + groups ---------- */
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-row input {
    flex: 1; font: inherit; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; min-width: 0;
  }
  .search-row.big input { font-size: 18px; padding: 15px 18px; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 7px 13px; font-size: 13.5px; color: var(--muted);
  }
  .chip[aria-pressed="true"], .tab[aria-selected="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .tab {
    border: 1px solid var(--line); background: #fff; border-radius: 9px 9px 0 0;
    padding: 9px 13px; font-size: 13.5px; color: var(--muted);
  }
  .count { color: var(--faint); font-size: 13px; margin-top: 10px; }

  /* ---------- grid ---------- */
  .grid-scroll { overflow-y: auto; margin-top: 10px; }
  .emoji-grid {
    display: grid; gap: 5px; padding: 4px;
    grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  }
  .cell {
    border: 1px solid transparent; background: transparent; border-radius: 9px;
    aspect-ratio: 1; font-size: 26px; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .cell:hover { background: #eef2ff; }
  .cell[aria-pressed="true"] { background: #e0e7ff; border-color: var(--accent); }
  .cell[hidden] { display: none; }

  /* ---------- variant layouts ---------- */
  .v-b-cols { display: grid; grid-template-columns: 1fr 340px; gap: 18px; align-items: start; }
  .rail { position: sticky; top: 14px; }
  @media (max-width: 880px) {
    .v-b-cols { grid-template-columns: 1fr; }
    .rail { position: static; }
  }
  /* Deliberately NOT sticky. A panel this tall (URL bar + slots + spoken form +
     verdict + claim button) pinned to the top covered the grid and swallowed
     clicks on the emoji underneath it. The grid has its own internal scroll, so
     the slots stay near the top without overlaying anything. */
  .sticky-slots { background: var(--bg); padding-top: 8px; }
  .sheet { margin-top: 16px; }

  /* ---------- screens ---------- */
  .screen { max-width: 470px; margin: 0 auto; padding: 24px; }
  .field { margin-top: 15px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .field input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .held-box { text-align: center; }
  .held-box .big { font-size: 56px; letter-spacing: .08em; }
  .countdown {
    display: inline-block; margin-top: 12px; background: var(--warn-bg);
    color: var(--warn); border: 1px solid #fde68a; border-radius: 999px;
    padding: 10px 18px; font-weight: 700; font-size: 16px;
  }
  .warn-strong {
    margin-top: 16px; background: var(--warn-bg); border: 1px solid #fde68a;
    color: var(--warn); border-radius: var(--radius); padding: 13px 15px;
    font-size: 14.5px; text-align: left;
  }
  .profile-box { text-align: center; }
  .profile-box .big { font-size: 64px; letter-spacing: .08em; }

  /* ---------- switcher ---------- */
  .switcher {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 60;
    display: flex; align-items: center; gap: 4px;
    background: #0f172a; color: #f8fafc; border-radius: 999px;
    padding: 6px 8px; box-shadow: 0 8px 26px rgb(15 23 42 / .3);
  }
  .switcher button { background: transparent; border: 0; color: #f8fafc; font-size: 17px; padding: 6px 11px; border-radius: 999px; }
  .switcher button:hover { background: #334155; }
  .switcher .label { font-size: 13px; padding: 0 6px; white-space: nowrap; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .skip { position: absolute; left: -9999px; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 10px 0; z-index: 100; }
  .skip:focus { left: 0; top: 0; position: fixed; }
</style>

  }
  function slotsSummary() {
    var names = filledNames();
    if (!names.length) return "All three slots are empty.";
    return "Handle so far: " + names.join(", ") + ". " +
      (names.length < 3 ? (3 - names.length) + " slot" + (names.length === 2 ? "" : "s") + " left." : "");
  }
  function focusSlot(i) {
    var el = document.querySelector('[data-slot="' + i + '"]');
    if (el) el.focus();
  }
  function say(id, msg) {
    var el = document.getElementById(id);
    if (el) { el.textContent = ""; setTimeout(function () { el.textContent = msg; }, 40); }
  }

  // Arriving at a Handle URL is the SAME component, just pre-filled.
  function arriveAt(h) {
    var glyphs = Array.from(h).filter(inSet);
    state.slots = [glyphs[0] || null, glyphs[1] || null, glyphs[2] || null];
    state.arrivedAt = glyphs.length === 3 ? glyphs.join("") : null;
    state.active = state.slots.indexOf(null) === -1 ? 0 : state.slots.indexOf(null);
    state.screen = "pick";
    render();
    say("live-slots", state.arrivedAt
      ? "Arrived at 3moji.me slash " + filledNames().join(", ") + ". " + verdictAnnouncement()
      : "3moji home page. All three slots are empty.");
  }

  // ---- shared flow components --------------------------------------------
  function urlbarMarkup() {
    var html = '<div class="urlbar"><span class="host">3moji.me/</span>';
    var names = [];
    for (var i = 0; i < 3; i++) {
      if (state.slots[i]) {
        html += '<span class="picked" aria-hidden="true">' + state.slots[i] + "</span>";
        names.push(nameOf(state.slots[i]));
      } else {
        html += '<span class="blank" aria-hidden="true"></span>';
      }
    }
    html += '<span class="sr-only">Your address so far: 3moji.me slash ' +
      (names.length ? esc(names.join(", ")) : "nothing yet, three empty slots") + "</span>";
    return html + "</div>";
  }

  function slotsMarkup() {
    var html = '<div class="slots-row">';
    for (var i = 0; i < 3; i++) {
      var g = state.slots[i];
      var label = g
        ? "Slot " + (i + 1) + ": " + nameOf(g) + ". Activate to re-pick this slot."
        : "Slot " + (i + 1) + ": empty. Activate to fill this slot next.";
      html +=
        '<div class="slot">' +
          '<button type="button" data-slot="' + i + '" aria-label="' + esc(label) + '"' +
            (state.active === i ? ' aria-current="true"' : "") +
            ' class="slot-btn' + (g ? " filled" : "") + (state.active === i ? " active" : "") + '">' +
            (g ? '<span aria-hidden="true">' + g + "</span>"
               : '<span aria-hidden="true" style="color:#cbd5e1">' + (i + 1) + "</span>") +
          "</button>" +
          '<div class="slot-name">' + (g ? esc(nameOf(g)) : "") + "</div>" +
          '<div class="slot-tools">' +
            '<button type="button" data-move="' + i + '" data-dir="-1" ' + (i === 0 || !g ? "disabled" : "") +
              ' aria-label="Move ' + esc(g ? nameOf(g) : "slot " + (i + 1)) + ' left">&#8592;</button>' +
            '<button type="button" data-clear="' + i + '" ' + (!g ? "disabled" : "") +
              ' aria-label="Clear slot ' + (i + 1) + (g ? ", " + esc(nameOf(g)) : "") + '">&#215;</button>' +
            '<button type="button" data-move="' + i + '" data-dir="1" ' + (i === 2 || !g ? "disabled" : "") +
              ' aria-label="Move ' + esc(g ? nameOf(g) : "slot " + (i + 1)) + ' right">&#8594;</button>' +
          "</div>" +
        "</div>";
    }
    html += "</div>";
    html +=
      '<div class="slot-actions">' +
        '<button type="button" class="btn" id="btn-shuffle">Surprise me</button>' +
        '<button type="button" class="btn" id="btn-clear-all">Clear all</button>' +
      "</div>";
    return html;
  }

  function spokenMarkup() {
    var names = filledNames();
    if (!names.length) {
      return '<div class="spoken"><div class="spoken-names" style="color:#94a3b8">Pick three to hear it</div></div>';
    }
    return (
      '<div class="spoken">' +
        '<div class="spoken-names">' + esc(names.join(" · ")) + "</div>" +
        '<div class="spoken-sentence">Say it out loud: <q>' + esc(spokenSentence(names)) + "</q></div>" +
      "</div>"
    );
  }

  function verdictMarkup() {
    var v = verdictState(), h = handleString(), body = "", head = "", word = "";
    if (v.kind === "reserved") {
      word = v.filled === 0 ? "Three to play" : v.filled + " of 3";
      head = "Three is the game";
      body = "Every Handle is exactly three emoji — repeats welcome. One- and two-emoji " +
             "Handles are Reserved, which is what keeps three fair for everyone.";
    } else if (v.kind === "available") {
      word = "Available";
      head = "You’re in luck — 3moji.me/" + h + " isn’t taken";
      body = "Nobody has this one. Claim it and we’ll hold it for you for 24 hours while you verify your email.";
    } else if (v.kind === "taken") {
      word = "Taken";
      head = "3moji.me/" + h + " belongs to someone";
      body = "This Handle is already claimed. You can go and look at it, or change a slot and make one of these yours:";
    } else {
      word = "Being claimed";
      head = "3moji.me/" + h + " is being claimed right now";
      body = "Someone is partway through claiming this one. If they don’t finish, it comes back — " +
             "check back later. In the meantime, these are free right now:";
    }
    var html =
      '<div class="verdict ' + v.kind + '">' +
        '<div class="status-word">' + esc(word) + "</div>" +
        "<h3>" + esc(head) + "</h3>" +
        "<p>" + body + "</p>";
    if (v.kind === "taken") {
      html += '<div class="slot-actions" style="justify-content:flex-start;margin-top:12px">' +
        '<button type="button" class="btn" id="btn-view-profile">View 3moji.me/' + h + " →</button></div>";
    }
    if (v.kind === "taken" || v.kind === "held") {
      var sg = suggestionsFor(state.slots);
      html += '<div class="suggestions">';
      sg.forEach(function (s) {
        var nm = Array.from(s.h).map(nameOf).join(", ");
        html +=
          '<button type="button" class="suggestion" data-suggest="' + s.h + '"' +
            ' aria-label="Use ' + esc(nm) + " instead — " + esc(s.why) + ', available">' +
            '<span aria-hidden="true">' + s.h + "</span>" +
            '<span class="sg-why" aria-hidden="true">' + esc(s.why) + "</span>" +
          "</button>";
      });
      html += "</div>";
    }
    return html + "</div>";
  }

  function claimButtonMarkup() {
    var v = verdictState(), ok = v.kind === "available";
    return (
      '<div class="slot-actions" style="margin-top:16px">' +
        '<button type="button" class="btn btn-primary btn-big" id="btn-claim" ' + (ok ? "" : "disabled") + ">" +
          (ok ? "Sign up and claim 3moji.me/" + handleString() : "Pick three free emoji to claim") +
        "</button>" +
      "</div>"
    );
  }

  function verdictAnnouncement() {
    var v = verdictState(), names = filledNames();
    if (v.kind === "reserved") return names.length ? slotsSummary() : "";
    var spoken = spokenSentence(names);
    if (v.kind === "available") return spoken + " is available. Ready to claim.";
    if (v.kind === "taken") return spoken + " is already taken. " +
      suggestionsFor(state.slots).length + " nearby Handles are free.";
    return spoken + " is being claimed by someone right now. Check back later. " +
      suggestionsFor(state.slots).length + " nearby Handles are free.";
  }

  function arrivedBanner() {
    if (!state.arrivedAt) return "";
    var k = availabilityOf(state.arrivedAt);
    var msg = k === "available"
      ? "You landed on <strong>3moji.me/" + state.arrivedAt + "</strong> and nobody owns it. It’s yours if you want it."
      : k === "taken"
        ? "You landed on <strong>3moji.me/" + state.arrivedAt + "</strong>, which is already someone’s."
        : "You landed on <strong>3moji.me/" + state.arrivedAt + "</strong>, which is mid-claim.";
    return '<div class="arrived-banner">' + msg + " Change any slot to build a different one.</div>";
  }

  // ---- variant layouts ----------------------------------------------------
  function searchMarkup(big) {
    return (
      '<div class="search-row' + (big ? " big" : "") + '">' +
        '<label class="sr-only" for="q">Search emoji by spoken name</label>' +
        '<input id="q" type="search" autocomplete="off" placeholder="Search by name — try &quot;ice&quot;, &quot;frog&quot;, &quot;rocket&quot;" value="' + esc(state.query) + '">' +
      "</div>"
    );
  }
  function chipsMarkup() {
    var html = '<div class="chips" role="group" aria-label="Filter by emoji group">';
    ["All"].concat(GROUPS).forEach(function (g) {
      html += '<button type="button" class="chip" data-group="' + esc(g) + '" aria-pressed="' +
        (state.group === g ? "true" : "false") + '">' + esc(g) + "</button>";
    });
    return html + "</div>";
  }
  function tabsMarkup() {
    var html = '<div class="tabs" role="tablist" aria-label="Emoji groups">';
    ["All"].concat(GROUPS).forEach(function (g) {
      html += '<button type="button" class="tab" role="tab" data-group="' + esc(g) + '" aria-selected="' +
        (state.group === g ? "true" : "false") + '">' + esc(g) + "</button>";
    });
    return html + "</div>";
  }

  function variantA() {
    return (
      '<div class="wrap">' +
        arrivedBanner() +
        '<div class="hero">' +
          (state.arrivedAt ? "" : '<div class="glyphs" aria-hidden="true">\u{1F9CA}\u{1F9CA}\u{1F9CA}</div>') +
          "<h1>" + (state.arrivedAt ? "Make it yours" : "Three emoji. One you.") + "</h1>" +
          "<p>3moji gives you a web address made of three emoji — short enough to say out loud, " +
          "easy enough to remember, and yours alone.</p>" +
          '<div class="say">“yeah, 3moji, three ice cubes”</div>' +
          '<div class="rule">Every Handle is exactly three. One and two are Reserved.</div>' +
        "</div>" +
        '<div class="sticky-slots">' +
          '<div id="mount-url"></div>' +
          '<div class="card slots-panel" style="margin-top:12px" id="mount-slots"></div>' +
          '<div id="mount-spoken"></div>' +
          '<div id="mount-verdict"></div>' +
          '<div id="mount-claim"></div>' +
        "</div>" +
        '<main id="picker-main" class="card slots-panel" style="margin-top:18px">' +
          "<h2 style='font-size:18px;margin-bottom:12px'>Find your three</h2>" +
          searchMarkup(true) + chipsMarkup() +
          '<div class="count" id="result-count"></div>' +
          '<div class="grid-scroll" id="mount-grid" style="max-height:44vh"></div>' +
        "</main>" +
      "</div>"
    );
  }

  function variantB() {
    return (
      '<div class="wrap">' +
        arrivedBanner() +
        '<div class="hero left" style="padding-bottom:14px">' +
          "<h1>" + (state.arrivedAt ? "Make it yours" : "Claim your three emoji") + "</h1>" +
          "<p style='margin-left:0'>A 3moji Handle is three emoji that point at everything you share. " +
          "Browse by category, or search by name.</p>" +
        "</div>" +
        '<div class="v-b-cols">' +
          '<main id="picker-main" class="card slots-panel">' +
            tabsMarkup() +
            '<div style="margin-top:14px">' + searchMarkup(false) + "</div>" +
            '<div class="count" id="result-count"></div>' +
            '<div class="grid-scroll" id="mount-grid" style="max-height:52vh"></div>' +
          "</main>" +
          '<div class="rail">' +
            '<div id="mount-url"></div>' +
            '<div class="card slots-panel" style="margin-top:12px" id="mount-slots"></div>' +
            '<div id="mount-spoken"></div>' +
            '<div id="mount-verdict"></div>' +
            '<div id="mount-claim"></div>' +
          "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function variantC() {
    var g = state.slots[state.active];
    return (
      '<div class="wrap">' +
        arrivedBanner() +
        '<div class="hero" style="padding-bottom:10px">' +
          "<h1>" + (state.arrivedAt ? "Make it yours" : "Fill three slots") + "</h1>" +
          "<p>Tap a slot, pick its emoji, move on. Repeats are welcome — " +
          "\u{1F9CA}\u{1F9CA}\u{1F9CA} is a perfectly good Handle.</p>" +
        "</div>" +
        '<div id="mount-url"></div>' +
        '<div class="card slots-panel" style="margin-top:12px" id="mount-slots"></div>' +
        '<div id="mount-spoken"></div>' +
        '<div id="mount-verdict"></div>' +
        '<div id="mount-claim"></div>' +
        '<main id="picker-main" class="card slots-panel sheet">' +
          "<h2 style='font-size:17px;margin-bottom:12px'>Filling slot " + (state.active + 1) +
            (g ? " — currently " + esc(nameOf(g)) : "") + "</h2>" +
          searchMarkup(false) + chipsMarkup() +
          '<div class="count" id="result-count"></div>' +
          '<div class="grid-scroll" id="mount-grid" style="max-height:40vh"></div>' +
        "</main>" +
      "</div>"
    );
  }

  function signupScreen() {
    var h = handleString(), names = filledNames();
    return (
      '<div class="wrap"><main id="picker-main" class="card screen">' +
        '<div style="text-align:center">' +
          '<div style="font-size:30px;color:#94a3b8">3moji.me/<span style="color:#0f172a;letter-spacing:.06em" aria-hidden="true">' + h + "</span></div>" +
          '<div class="spoken-names" style="margin-top:8px">' + esc(names.join(" · ")) + "</div>" +
          '<div class="spoken-sentence">You are claiming <q>' + esc(spokenSentence(names)) + "</q></div>" +
        "</div>" +
        '<div class="field"><label for="email">Email</label>' +
          '<input id="email" type="email" autocomplete="email" placeholder="you@example.com">' +
          '<div class="hint">We send one verification link here. Nothing else.</div></div>' +
        '<div class="field"><label for="pw">Password</label>' +
          '<input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-hint">' +
          '<div class="hint" id="pw-hint">At least 8 characters.</div></div>' +
        '<div class="warn-strong">We’ll hold <strong>3moji.me/' + h + "</strong> for <strong>24 hours</strong> " +
          "while you verify your email. Miss that window and the Handle goes back in the pool for anyone to take.</div>" +
        '<div class="slot-actions" style="margin-top:18px">' +
          '<button type="button" class="btn" id="btn-back">&#8592; Back to the picker</button>' +
          '<button type="button" class="btn btn-primary" id="btn-create">Create account</button>' +
        "</div>" +
      "</main></div>"
    );
  }

  var claimedEmail = "your inbox";
  function heldScreen() {
    var h = handleString(), names = filledNames();
    return (
      '<div class="wrap"><main id="picker-main" class="card screen held-box">' +
        '<div style="font-size:40px" aria-hidden="true">✉️</div>' +
        "<h1 style='font-size:26px;margin-top:10px'>Check your email</h1>" +
        '<p class="hint" style="font-size:15px">We sent a verification link to <strong>' + esc(claimedEmail) +
          "</strong>. Click it and 3moji.me/" + h + " is yours for good.</p>" +
        '<div class="big" style="margin-top:16px" aria-hidden="true">' + h + "</div>" +
        '<div class="spoken-names" style="margin-top:4px">' + esc(names.join(" · ")) + "</div>" +
        '<div class="countdown" role="status">Held for you — 23:59:41 left</div>' +
        '<div class="warn-strong">Nobody else can claim <strong>3moji.me/' + h + "</strong> while the hold lasts. " +
          "<strong>If the 24 hours run out before you verify, the hold is released and anyone can take it.</strong> " +
          "Didn’t get the email? Check spam, or resend below.</div>" +
        '<div class="slot-actions" style="margin-top:18px">' +
          '<button type="button" class="btn">Resend the email</button>' +
          '<button type="button" class="btn" id="btn-restart">Start the prototype over</button>' +
        "</div>" +
      "</main></div>"
    );
  }

  // A claimed Handle whose owner hasn't set anything up yet is never blank.
  function profileScreen() {
    var h = handleString(), names = filledNames();
    return (
      '<div class="wrap"><main id="picker-main" class="card screen profile-box">' +
        '<div style="color:#94a3b8;font-size:15px">3moji.me/</div>' +
        '<div class="big" aria-hidden="true">' + h + "</div>" +
        '<h1 class="spoken-names" style="margin-top:6px">' + esc(names.join(" · ")) + "</h1>" +
        '<p class="hint" style="font-size:15px;margin-top:14px">This page is being set up. ' +
          "Its owner hasn’t added anything yet — check back soon.</p>" +
        '<div class="slot-actions" style="margin-top:22px">' +
          '<button type="button" class="btn" id="btn-back">&#8592; Back to the picker</button>' +
          '<button type="button" class="btn btn-primary" id="btn-restart">Claim one of your own</button>' +
        "</div>" +
      "</main></div>"
    );
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---- render -------------------------------------------------------------
  var lastAnnounced = "";
  function render() {
    var app = document.getElementById("app");
    if (state.screen === "signup")  { app.innerHTML = signupScreen();  wireScreens(); return; }
    if (state.screen === "held")    { app.innerHTML = heldScreen();    wireScreens(); return; }
    if (state.screen === "profile") { app.innerHTML = profileScreen(); wireScreens(); return; }

    // Re-rendering the layout detaches the grid, so DOM focus drops to <body>.
    // After that the document-level arrow handler would cycle the VARIANT
    // instead of moving in the grid, and a keyboard user could only ever place
    // one emoji. Remember the focused cell and restore it below.
    var keepFocus = gridEl.contains(document.activeElement)
      ? Number(document.activeElement.dataset.i)
      : -1;

    app.innerHTML = state.variant === "A" ? variantA() : state.variant === "B" ? variantB() : variantC();
    document.getElementById("mount-url").innerHTML = urlbarMarkup();
    document.getElementById("mount-slots").innerHTML = slotsMarkup();
    document.getElementById("mount-spoken").innerHTML = spokenMarkup();
    document.getElementById("mount-verdict").innerHTML = verdictMarkup();
    document.getElementById("mount-claim").innerHTML = claimButtonMarkup();
    document.getElementById("mount-grid").appendChild(gridEl);

    for (var n = 0; n < EMOJI.length; n++) {
      cells[n].setAttribute("aria-selected", state.slots.indexOf(EMOJI[n][0]) !== -1 ? "true" : "false");
    }
    applyFilter(false);

    // Put focus back on the cell the keyboard user was on (applyFilter has just
    // reset the roving tabindex to the first visible cell). Without this a
    // keyboard user can only ever place ONE emoji: focus falls to <body> and the
    // next arrow key cycles the prototype variant instead of moving in the grid.
    if (keepFocus !== -1) {
      var vi = visible.indexOf(keepFocus);
      if (vi !== -1) {
        cells[visible[rover]].tabIndex = -1;
        rover = vi;
        cells[keepFocus].tabIndex = 0;
        cells[keepFocus].focus();
      }
    }

    document.getElementById("v-label").textContent = state.variant + " (" + VARIANTS[state.variant] + ")";

    var ann = verdictAnnouncement();
    if (ann && ann !== lastAnnounced) { lastAnnounced = ann; say("live-verdict", ann); }
  }

  // ---- events -------------------------------------------------------------
  function wireScreens() {
    var b;
    if ((b = document.getElementById("btn-back")))    b.onclick = function () { state.screen = "pick"; render(); };
    if ((b = document.getElementById("btn-create")))  b.onclick = function () {
      var e = document.getElementById("email");
      claimedEmail = e && e.value ? e.value : "your inbox";
      state.screen = "held"; render();
    };
    if ((b = document.getElementById("btn-restart"))) b.onclick = function () {
      state.screen = "pick"; state.slots = [null, null, null]; state.active = 0;
      state.arrivedAt = null; render();
    };
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target : null;
    if (!t) return;
    var el;
    if ((el = t.closest("[data-arrive]")))  { arriveAt(el.dataset.arrive); return; }
    if ((el = t.closest("[data-slot]")))    { state.active = Number(el.dataset.slot); render(); focusSlot(state.active); return; }
    if ((el = t.closest("[data-clear]")))   { clearSlot(Number(el.dataset.clear)); return; }
    if ((el = t.closest("[data-move]")))    { moveSlot(Number(el.dataset.move), Number(el.dataset.dir)); return; }
    if ((el = t.closest("[data-group]")))   { state.group = el.dataset.group; render(); say("live-filter", el.dataset.group + " selected, " + visible.length + " emoji"); return; }
    if ((el = t.closest("[data-suggest]"))) {
      state.slots = Array.from(el.dataset.suggest); state.active = 0; state.arrivedAt = null; render();
      say("live-slots", "Switched to " + filledNames().join(", ") + ". Available.");
      return;
    }
    if (t.id === "btn-shuffle")      { shuffle(); return; }
    if (t.id === "btn-clear-all")    { clearAll(); return; }
    if (t.id === "btn-claim")        { state.screen = "signup"; render(); return; }
    if (t.id === "btn-view-profile") { state.screen = "profile"; render(); return; }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target.id === "q") { state.query = ev.target.value.trim().toLowerCase(); applyFilter(true); }
  });

  // Variant cycling. Arrow keys belong to the grid, so only cycle when focus is
  // outside the grid and outside any text field.
  function cycle(d) {
    var keys = ["A", "B", "C"];
    state.variant = keys[(keys.indexOf(state.variant) + d + 3) % 3];
    location.hash = "variant=" + state.variant;
    render();
  }
  document.getElementById("v-prev").onclick = function () { cycle(-1); };
  document.getElementById("v-next").onclick = function () { cycle(1); };
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (t && t.closest && t.closest(".emoji-grid")) return;
    if (ev.key === "ArrowLeft") cycle(-1);
    if (ev.key === "ArrowRight") cycle(1);
  });

  var m = /variant=([ABC])/.exec(location.hash);
  if (m) state.variant = m[1];
  var at = /at=([^&]+)/.exec(location.hash);
  if (at) { arriveAt(decodeURIComponent(at[1])); } else { render(); }
})();
</script>
